# Netlify reads this file from the repo root before anything else, so the whole
# deploy is configured here rather than split across a second netlify.toml.
#
# `base` moves the build into react/. `command` and `publish` are then resolved
# relative to it, so publish = "dist" means react/dist.
#
# Images and videos deliberately stay at the repo root — react/vite.config.js
# serves them from ../ in dev and copies them into dist/ at build time. Netlify
# clones the full repo, so that works; just don't switch to a sparse checkout of
# react/ alone.

[build]
  base = "react"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 requires ^20.19.0 || >=22.12.0. Netlify's "20" alias resolves to the
  # latest 20.x, which normally satisfies that, but pinning 22 removes the risk
  # of landing on an older 20.x and failing at install time.
  NODE_VERSION = "22"

# SPA fallback: /project/:id must serve index.html on a hard refresh.
# react/public/_redirects carries the same rule into dist/ as a backstop.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Redirect and header paths are URL paths, so `base` does not affect them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/project-video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
