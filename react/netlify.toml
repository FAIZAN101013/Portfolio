# Point Netlify at this directory (Site settings → Build & deploy → Base directory
# = "react") and it will pick this file up.
#
# Images and videos are not stored in react/ — they live at the repo root and are
# copied into dist/ by vite-plugin-static-copy, so the base directory needs
# access to the parent. Netlify clones the whole repo, so this works as-is.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback for /design/:id — also covered by public/_redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/project-video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
